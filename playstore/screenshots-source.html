<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:360px; height:640px; overflow:hidden; }
  body { font-family:"Segoe UI", Roboto, system-ui, sans-serif; }

  /* ---- status bar ---- */
  .sb { height:24px; display:flex; align-items:center; padding:0 14px; font-size:11px; font-weight:600; }
  .sb .sp { flex:1; }
  .sb svg { margin-left:6px; }

  /* ---- shared header ---- */
  .hdr { display:flex; align-items:center; gap:12px; padding:10px 16px 12px; }
  .hdr .title { font-size:19px; font-weight:700; flex:1; }
  .burger { width:22px; } .burger div { height:2.6px; border-radius:2px; margin:4px 0; }
  .avatar { width:26px; height:26px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; }
  .avatar div { width:11px; height:11px; border-radius:50%; }

  /* ================= DASHBOARD ================= */
  .dash { height:100%; }
  .dash.light { background:#f7f8fa; --card:#eef1f4; --ink:#1f2935; --muted:#5a6470; --tile:#ffffff; --bal:#1D5379; }
  .dash.dark  { background:#0d1114; --card:#161c22; --ink:#e8edf2; --muted:#94a1ac; --tile:#0d1114; --bal:#6cb1f0; }
  .dash .sb, .dash .hdr { color:var(--ink); }
  .dash .burger div, .theme .burger div { background:var(--ink); }
  .dash .avatar { background:#1D5379; } .dash .avatar div { background:#cfe3ef; }
  .body { padding:0 16px; }
  .glance { display:flex; align-items:baseline; }
  .glance b { font-size:15px; font-weight:700; color:var(--ink); flex:1; }
  .glance span { font-size:10px; color:var(--muted); }
  .caption { font-size:10px; color:var(--muted); margin:4px 0 10px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stat { background:var(--card); border-radius:9px; padding:10px 12px 7px; }
  .stat .t { font-size:11px; color:var(--muted); }
  .stat .v { font-size:20px; font-weight:700; color:var(--ink); margin:1px 0 1px; }
  .stat .d { font-size:10px; color:var(--muted); height:13px; }
  .stat svg { width:100%; height:25px; display:block; }
  .company { margin-top:10px; background:var(--card); border-radius:9px 9px 0 0; padding:12px 13px; display:flex; align-items:center; }
  .company b { flex:1; font-size:17px; font-weight:700; color:var(--ink); }
  .pin { width:30px; height:30px; border-radius:6px; background:#cfdbe6; display:flex; align-items:center; justify-content:center; }
  .row { margin-top:3px; background:var(--card); padding:9px 13px; display:flex; align-items:center; gap:12px; }
  .tile { width:34px; height:34px; border-radius:6px; background:var(--tile); flex:none;
          display:flex; align-items:center; justify-content:center; }
  .rl { flex:1; min-width:0; }
  .rl .lab { font-size:9px; letter-spacing:1.4px; color:var(--muted); }
  .rl .val { font-size:17px; font-weight:700; margin-top:1px; color:var(--ink); }
  .row svg.spark { width:112px; height:34px; flex:none; }
  .green { color:#1e9e50 !important; } .dark .green { color:#2fbf68 !important; }
  .red { color:#e4443a !important; } .dark .red { color:#f0655c !important; }
  .blue { color:var(--bal) !important; }
  .updated { margin-top:3px; background:var(--card); border-radius:0 0 9px 9px; padding:10px 13px;
             font-size:11px; color:var(--muted); display:flex; align-items:center; gap:8px; }

  /* ================= EDIT BRANCH ================= */
  .br { height:100%; background:#0a1519; --ink:#e8eef2; --muted:#8fa0aa; }
  .br .sb, .br .hdr { color:var(--ink); }
  .br .burger div { background:var(--ink); }
  .br .avatar { background:#1BAFB3; } .br .avatar div { background:#0a1519; }
  .tabs { display:flex; gap:8px; padding:0 16px; }
  .tab { background:#10232b; border-radius:7px; padding:9px 12px; font-size:11.5px; color:#9fb2bb;
         display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .tab.active { color:#4fc3d8; font-weight:700; }
  .tab .n { width:17px; height:17px; border-radius:50%; background:#155e6e; color:#cfeef5;
            font-size:10px; display:flex; align-items:center; justify-content:center; }
  .tab .ck { color:#4fc3d8; font-size:12px; }
  .bar { height:4px; border-radius:2px; background:#123039; margin:10px 16px 12px; position:relative; }
  .bar div { position:absolute; left:0; top:0; bottom:0; border-radius:2px; background:#1BAFB3; }
  .br .cap { font-size:11.5px; color:var(--muted); padding:0 16px; margin-bottom:12px; }
  .brrow { display:flex; align-items:center; padding:0 16px; }
  .brrow .t { flex:1; font-size:15px; font-weight:600; color:var(--ink); }
  .brdesc { font-size:10.5px; color:var(--muted); padding:0 16px; margin:4px 0 13px; line-height:1.5; }
  .tg2 { width:46px; height:24px; border-radius:12px; position:relative; flex:none; }
  .tg2::after { content:""; position:absolute; top:3px; width:18px; height:18px; border-radius:50%; }
  .tg2.on { background:#178090; } .tg2.on::after { right:3px; background:#fff; }
  .tg2.off { background:#22333b; border:1px solid #33454e; } .tg2.off::after { left:3px; background:#7d8f99; }
  .btns { display:flex; gap:12px; padding:10px 16px 0; }
  .btn { flex:1; border-radius:7px; padding:12px 0; text-align:center; font-size:13.5px; font-weight:600; }
  .btn.ghost { border:1px solid #1f4a56; color:#4fc3d8; }
  .btn.fill { background:#178090; color:#fff; }
</style>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <path id="sp1" d="M2 22 C8 22 10 12 16 12 S26 20 32 19 S40 8 46 15 S56 22 62 21 S68 6 76 10 S90 20 98 17"/>
    <path id="sp2" d="M2 21 C10 21 14 15 20 17 S30 21 36 20 S44 10 50 16 S58 21 64 21 S70 4 78 8 S90 21 98 20"/>
    <path id="sp3" d="M2 20 C8 20 10 6 16 6 S22 20 30 21 S38 17 44 19 S54 21 60 20 S70 17 78 19 S90 20 98 19"/>
    <path id="sp4" d="M2 18 C6 12 10 8 16 9 S24 18 30 17 S38 14 44 16 S52 20 58 18 S66 8 74 10 S88 18 98 15"/>
    <path id="sp5" d="M2 20 C8 20 10 6 18 5 S28 16 34 12 S42 6 48 10 S56 22 62 20 S68 4 76 5 S88 18 98 21"/>
    <path id="sp6" d="M2 21 C8 21 12 18 18 19 S26 21 32 20 S38 6 44 8 S52 21 58 20 S64 18 70 19 S76 7 84 9 S92 20 98 20"/>
    <path id="sp7" d="M2 24 C10 23 14 12 20 13 S28 20 34 18 S40 14 46 15 S54 8 60 10 S68 18 74 16 S82 6 90 8 L98 7"/>
  </defs>
</svg>

<script>
const params = new URLSearchParams(location.search);
const VARIANT = params.get('v') || 'dash-dark';

const ico=(p,c,s)=>`<svg width="${s||18}" height="${s||18}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const bell=(c,s)=>ico('<path d="M18 16H6c1.5-1.5 2-3 2-6a4 4 0 0 1 8 0c0 3 .5 4.5 2 6zM10 19a2 2 0 0 0 4 0"/>',c,s);
const gear=(c,s)=>ico('<circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>',c,s);
const rf=(c,s)=>ico('<path d="M20 11a8 8 0 1 0-2.3 6.3M20 5v6h-6"/>',c,s);
const pin=ico('<path d="M12 21s-7-6.1-7-11a7 7 0 0 1 14 0c0 4.9-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/>','#1D5379');
const cal=c=>ico('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/>',c);
const dn =c=>ico('<path d="M12 4v10m0 0l-4-4m4 4l4-4M4 20h16"/>',c);
const up =c=>ico('<path d="M12 20V10m0 0l-4 4m4-4l4 4M4 4h16"/>',c);
const wal=c=>ico('<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M15 15h2"/>',c);

const statusBar=()=>`<div class="sb"><span>10:30</span><span class="sp"></span>
  ${ico('<path d="M2 9a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16a5 5 0 0 1 6 0M12 19h.01"/>','currentColor',13)}
  ${ico('<rect x="3" y="8" width="16" height="9" rx="2"/><path d="M21 11v3"/>','currentColor',13)}</div>`;

const S=(id,color,fid,cy)=>`<svg class="spark" viewBox="0 0 100 28" preserveAspectRatio="none">
    <defs><linearGradient id="${fid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/>
    </linearGradient></defs>
    <use href="#${id}" fill="url(#${fid})" stroke="none"></use>
    <use href="#${id}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <circle r="2.4" fill="${color}" cx="98" cy="${cy}"/>
  </svg>`;

/* ================= dashboard ================= */
function dashboard(theme){
  const dark = theme === 'dark';
  const inkIco = dark ? '#e8edf2' : '#1f2935';
  const stat=(t,v,d,sp,c,f,cy)=>`<div class="stat"><div class="t">${t}</div><div class="v">${v}</div>
     <div class="d">${d}</div>${S(sp,c,f,cy)}</div>`;
  const row=(icon,lab,val,cls,spark)=>`<div class="row"><div class="tile">${icon}</div>
     <div class="rl"><div class="lab">${lab}</div><div class="val ${cls}">${val}</div></div>${spark||''}</div>`;
  const g = dark ? '#2fbf68' : '#1e9e50', r = dark ? '#f0655c' : '#e4443a';
  return `<div class="dash ${theme}">
    ${statusBar()}
    <div class="hdr"><div class="burger"><div></div><div></div><div></div></div>
      <div class="title">Dashboard</div>
      ${gear(inkIco)}${rf(inkIco)}${bell(inkIco)}<div class="avatar"><div></div></div></div>
    <div class="body">
      <div class="glance"><b>Today at a glance</b><span>Trx Date: 12/08/2026</span></div>
      <div class="caption">change vs previous day · sparkline last 14 days</div>
      <div class="grid">
        ${stat('Today Sales','0','▼ 100%','sp1','#14b8a6','f1',17)}
        ${stat('Today Purchase','0','—','sp2','#f0a11c','f2',20)}
        ${stat('New Customers','1','—','sp3','#22c3ee','f3',19)}
        ${stat('Today Vouchers','3','▼ 81%','sp4','#7d8b99','f4',15)}
      </div>
      <div class="company"><b>ABC Traders</b><div class="pin">${pin}</div></div>
      ${row(cal('#178A9E'),'TRANSACTION DATE','12/08/2026','')}
      ${row(dn(g),'TODAY RECEIVED','23,000','green',S('sp5','#22a34a','f5',21))}
      ${row(up(r),'TODAY PAYMENT','1,700','red',S('sp6','#ef4444','f6',20))}
      ${row(wal('#8b5cf6'),'BALANCE','6,71,366','blue',S('sp7','#8b5cf6','f7',7))}
      <div class="updated">${rf(dark?'#94a1ac':'#5a6470',13)} Last updated: just now</div>
    </div>
  </div>`;
}

/* ================= edit branch ================= */
function branch(kind){
  const controls = kind === 'controls';
  const tabs = controls
    ? `<div class="tab"><span class="ck">✓</span> Real Estate Setup</div>
       <div class="tab active"><span class="n">7</span> Feature Controls</div>`
    : `<div class="tab active"><span class="n">5</span> Product Setup</div>
       <div class="tab"><span class="n">6</span> Real Estate Setup</div>`;
  const cap = controls
    ? 'Operational controls, sharing options, and SMS preferences.'
    : 'How products are ordered and priced in this branch.';
  const rows = controls ? [
      ['Control manufacture', true, 'Opens the production side, so an item can be built from other items instead of only bought and sold.'],
      ['Multiple warehouse', false, 'Vouchers say which warehouse stock moved in or out of. Off, everything sits in one.'],
      ['Opening ongoing', false, 'The branch is still entering its opening figures, so products and parties can take an opening balance.'],
      ['Need demo tutorial', true, 'Offers the guided walkthrough to users of this branch.'],
      ['SMS service', true, 'The master switch for this branch. Off, none of the messages below go out.'],
      ['Received SMS', true, 'Texts the party when money received from them is posted.'],
      ['Sales SMS', false, 'Texts the customer when a sale is invoiced to them.'],
    ] : [
      ['Multi Product Order?', false, 'On: one order can carry several products. Off: the original single-product order form.'],
      ['Stock with zero', false, 'Keeps items with no balance on the stock report, so what has run out is still visible.'],
      ['Stock: Brand → Category → Item', true, 'Groups the stock report by brand, then category, then item.'],
      ['Warranty control', true, 'Products carry a warranty period, asked for at setup and tracked from the sale.'],
      ['Product share', true, 'Products entered anywhere in the company can be picked here.'],
      ['Product Tracking?', true, 'Cash Received and Payment ask which product the money was for, and the Product Statement reports on it.'],
    ];
  const rowsHtml = rows.map(([t,on,d]) =>
    `<div class="brrow"><div class="t">${t}</div><div class="tg2 ${on?'on':'off'}"></div></div>
     <div class="brdesc">${d}</div>`).join('');
  const btns = controls
    ? `<div class="btn ghost">‹&nbsp; Back</div><div class="btn fill">Update Branch</div>`
    : `<div class="btn ghost">‹&nbsp; Back</div><div class="btn fill">Next &nbsp;›</div>`;
  return `<div class="br">
    ${statusBar()}
    <div class="hdr"><div class="burger"><div></div><div></div><div></div></div>
      <div class="title">Edit Branch</div>${bell('#e8eef2')}<div class="avatar"><div></div></div></div>
    <div class="tabs">${tabs}</div>
    <div class="bar"><div style="width:${controls?'100%':'71%'}"></div></div>
    <div class="cap">${cap}</div>
    ${rowsHtml}
    <div class="btns">${btns}</div>
  </div>`;
}

const html =
  VARIANT === 'dash-light' ? dashboard('light') :
  VARIANT === 'dash-dark'  ? dashboard('dark')  :
  VARIANT === 'controls'   ? branch('controls') :
                             branch('products');
document.body.insertAdjacentHTML('beforeend', html);
</script>
